      function escapeHtml(value) {

          }
          return header + rows.map(row =&gt; `&lt;tr&gt;
            &lt;td&gt;${escapeHtml(group.key)} · &lt;code&gt;${escapeHtml(group.table)}&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;${escapeHtml(group.pk)} = ${escapeHtml(row.detailId)}&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;MicroInSample_Num = ${escapeHtml(record.micro)}&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;${escapeHtml(group.refColumn)} = ${escapeHtml(row.refId)}&lt;/code&gt; → &lt;code&gt;${escapeHtml(group.refTable)}&lt;/code&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(row.refCode)}&lt;/span&gt;&lt;/td&gt;
            &lt;td class=&quot;text-end&quot;&gt;${escapeHtml(row.percentage)}%&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;Method_PercentEstimate = ${escapeHtml(row.methodId)}&lt;/code&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(methods[row.methodId] || &#x27;未解析&#x27;)}&lt;/span&gt;&lt;/td&gt;
          &lt;/tr&gt;`).join(&#x27;&#x27;);
        }).join(&#x27;&#x27;);
      }

      function renderRecord(record) {
        const details = detailsFor(record);
        root.querySelector(&#x27;#fatima-summary-title&#x27;).textContent = `${record.dbLocation} · SampleUniqueID ${record.sample}`;
        root.querySelector(&#x27;#fatima-source-summary&#x27;).textContent = `Sheet1 第 ${record.sourceRow} 行 · ${record.sourceLocation} · ${record.sourceDate}`;
        root.querySelector(&#x27;#fatima-db-summary&#x27;).textContent = `Location ${record.location} → Event ${record.event} → Sample ${record.sample} → Micro ${record.micro}`;
        root.querySelector(&#x27;#fatima-batch-summary&#x27;).textContent = `${record.batch} · microplastics count ${record.count}`;
        root.querySelector(&#x27;#fatima-entered-summary&#x27;).textContent = record.entered;

        const note = root.querySelector(&#x27;#fatima-record-note&#x27;);
        if (record.alert) {
          note.className = &#x27;trace-alert&#x27;;
          note.textContent = record.alert;
        } else {
          note.className = &#x27;trace-note&#x27;;
          note.textContent = `Excel 第 ${record.sourceRow} 行与这条数据库主链对应；明细按 MicroInSample_Num = ${record.micro} 汇总。`;
        }

        root.querySelector(&#x27;#fatima-node-location&#x27;).innerHTML = nodeMarkup(&#x27;Location&#x27;, [
          { label:&#x27;PRIMARY KEY&#x27;, key:&#x27;Loc_UniqueID&#x27;, value:record.location },
          { label:&#x27;地点&#x27;, key:&#x27;LocationName&#x27;, value:record.dbLocation }
        ]);
        root.querySelector(&#x27;#fatima-node-event&#x27;).innerHTML = nodeMarkup(&#x27;SamplingEvent&#x27;, [
          { label:&#x27;UNIQUE 记录键&#x27;, key:&#x27;SamplingEventUniqueID&#x27;, value:record.event },
          { label:&#x27;外键&#x27;, key:&#x27;LocationID_Num&#x27;, value:record.location },
          { label:&#x27;采样日期&#x27;, key:&#x27;SamplingDate&#x27;, value:record.dbDate }
        ]);
        root.querySelector(&#x27;#fatima-node-sample&#x27;).innerHTML = nodeMarkup(&#x27;SampleDetails&#x27;, [
          { label:&#x27;UNIQUE 记录键&#x27;, key:&#x27;SampleUniqueID&#x27;, value:record.sample },
          { label:&#x27;外键&#x27;, key:&#x27;SamplingEvent_Num&#x27;, value:record.event },
          { label:&#x27;媒介外键&#x27;, key:&#x27;MediaType_SelectID&#x27;, value:1 }
        ]);
        root.querySelector(&#x27;#fatima-node-micro&#x27;).innerHTML = nodeMarkup(&#x27;MicroplasticsInSample&#x27;, [
          { label:&#x27;PRIMARY KEY&#x27;, key:&#x27;Micro_UniqueID&#x27;, value:record.micro },
          { label:&#x27;外键&#x27;, key:&#x27;SampleDetails_Num&#x27;, value:record.sample },
          { label:&#x27;计数&#x27;, key:&#x27;Micro5mmAndSmaller_Count&#x27;, value:record.count }
        ]);
        root.querySelector(&#x27;#fatima-node-details&#x27;).innerHTML = nodeMarkup(&#x27;Microplastics*Details&#x27;, [
          { label:&#x27;所有明细共同外键&#x27;, key:&#x27;MicroInSample_Num&#x27;, value:record.micro },
          { label:&#x27;本样本明细行&#x27;, key:&#x27;row_count&#x27;, value:rowCount(details) }
        ]);

        const publication = publications[record.publication];
        root.querySelector(&#x27;#fatima-reference-strip&#x27;).innerHTML = [
          `&lt;div class=&quot;reference-link&quot;&gt;&lt;code&gt;SamplingEvent.PublicationID_Num = ${record.publication}&lt;/code&gt; → &lt;code&gt;Publications.PublicationUniqueID&lt;/code&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(publication.label)}&lt;/span&gt;&lt;/div&gt;`,
          `&lt;div class=&quot;reference-link&quot;&gt;&lt;code&gt;SampleDetails.MediaType_SelectID = 1&lt;/code&gt; → &lt;code&gt;MediaType_WithinLitterWaterSoil_Ref.MediaTypeUniqueID&lt;/code&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;In Water&lt;/span&gt;&lt;/div&gt;`,
          `&lt;div class=&quot;reference-link&quot;&gt;&lt;code&gt;MicroplasticsInSample.Method_Polymer_Num = ${record.polymerMethod ?? &#x27;NULL&#x27;}&lt;/code&gt; → &lt;code&gt;Methods_Ref.MethodsUniqueID&lt;/code&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(record.polymerMethod ? methods[record.polymerMethod] : &#x27;未填写&#x27;)}&lt;/span&gt;&lt;/div&gt;`,
          `&lt;div class=&quot;reference-link&quot;&gt;&lt;code&gt;Details.Method_PercentEstimate = 14&lt;/code&gt; → &lt;code&gt;Methods_Ref.MethodsUniqueID&lt;/code&gt;&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(methods[14])}（逻辑对应，无 FK）&lt;/span&gt;&lt;/div&gt;`
        ].join(&#x27;&#x27;);

        renderDetails(record, details);
        root.querySelector(&#x27;#fatima-sql-block&#x27;).textContent = sqlFor(record);
      }

      function renderSelector() {
        const select = root.querySelector(&#x27;#fatima-record-select&#x27;);
        const batches = [...new Set(records.map(record =&gt; record.batch))];
        select.innerHTML = batches.map(batch =&gt; {
          const options = records.filter(record =&gt; record.batch === batch).map(record =&gt;
            `&lt;option value=&quot;${record.sample}&quot;&gt;Sample ${record.sample} · Micro ${record.micro} · ${escapeHtml(record.dbLocation)} · ${record.dbDate}${record.alert ? &#x27; · 注意&#x27; : &#x27;&#x27;}&lt;/option&gt;`
          ).join(&#x27;&#x27;);
          return `&lt;optgroup label=&quot;${escapeHtml(batch)}&quot;&gt;${options}&lt;/optgroup&gt;`;
        }).join(&#x27;&#x27;);
        select.value = &#x27;150&#x27;;
      }

      function renderIndex() {
        root.querySelector(&#x27;#fatima-record-index&#x27;).innerHTML = records.map(record =&gt; `&lt;tr&gt;
          &lt;td class=&quot;index-select&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-select-sample=&quot;${record.sample}&quot;&gt;Sample ${record.sample}&lt;/button&gt;&lt;/td&gt;
          &lt;td&gt;${escapeHtml(record.sourceRow)}&lt;/td&gt;
          &lt;td&gt;${escapeHtml(record.dbLocation)}&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${escapeHtml(record.dbDate)}&lt;/span&gt;&lt;/td&gt;
          &lt;td class=&quot;text-end&quot;&gt;${record.location}&lt;/td&gt;
          &lt;td class=&quot;text-end&quot;&gt;${record.event}&lt;/td&gt;
          &lt;td class=&quot;text-end&quot;&gt;${record.sample}&lt;/td&gt;
          &lt;td class=&quot;text-end&quot;&gt;${record.micro}&lt;/td&gt;
          &lt;td class=&quot;status-cell&quot;&gt;${escapeHtml(record.batch)}${record.alert ? `&lt;br&gt;&lt;span class=&quot;text-destructive&quot;&gt;${escapeHtml(record.alert)}&lt;/span&gt;` : &#x27;&#x27;}&lt;/td&gt;
        &lt;/tr&gt;`).join(&#x27;&#x27;);
      }

      function selectRecord(sampleId) {
        const record = records.find(item =&gt; String(item.sample) === String(sampleId));
        if (!record) return;
        root.querySelector(&#x27;#fatima-record-select&#x27;).value = String(record.sample);
        renderRecord(record);
      }

      async function copySql() {
        const text = root.querySelector(&#x27;#fatima-sql-block&#x27;).textContent;
        const statuses = [
          root.querySelector(&#x27;#fatima-copy-status-top&#x27;),
          root.querySelector(&#x27;#fatima-copy-status&#x27;)
        ];
        try {
          await navigator.clipboard.writeText(text);
          statuses.forEach(status =&gt; { status.textContent = &#x27;已复制当前记录 SQL&#x27;; });
        } catch (error) {
          statuses.forEach(status =&gt; { status.textContent = &#x27;浏览器未允许复制，请展开下方 SQL 手动选择。&#x27;; });
        }
      }

      renderSelector();
      renderIndex();
      selectRecord(150);

      root.querySelector(&#x27;#fatima-record-select&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; selectRecord(event.target.value));
      root.querySelector(&#x27;#fatima-copy-sql&#x27;).addEventListener(&#x27;click&#x27;, copySql);
      root.querySelector(&#x27;#fatima-copy-sql-secondary&#x27;).addEventListener(&#x27;click&#x27;, copySql);
      root.querySelector(&#x27;#fatima-record-index&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;[data-select-sample]&#x27;);
        if (!button) return;
        selectRecord(button.dataset.selectSample);
        root.querySelector(&#x27;#fatima-record-select&#x27;).focus();
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
